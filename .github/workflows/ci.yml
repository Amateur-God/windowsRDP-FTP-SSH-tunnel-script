name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x connect.ps1 installSSH.ps1 2>/dev/null || true
          echo "PowerShell scripts present — syntax checked in pwsh step"

  pwsh:
    name: PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $errors = 0
          foreach ($file in @('connect.ps1', 'installSSH.ps1')) {
            if (Test-Path $file) {
              $tokens = $null; $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                $parseErrors | ForEach-Object { Write-Error $_ }
                $errors++
              }
            }
          }
          if ($errors -gt 0) { exit 1 }

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/verify-dco.sh

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [shellcheck, pwsh, dco]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.shellcheck.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.pwsh.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.dco.result }}" != "success" ]]; then exit 1; fi
          echo "All required CI checks passed."
